plugins {
    id 'com.android.application'
}

def signingEnvironment = [
    storeFile: System.getenv('SAVELY_ANDROID_KEYSTORE'),
    storePassword: System.getenv('SAVELY_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('SAVELY_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('SAVELY_ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = signingEnvironment.values().every { it != null && !it.isBlank() }
def releaseVersion = new groovy.json.JsonSlurper().parse(new File(rootProject.projectDir.parentFile, 'release.json'))
if (!(releaseVersion.versionCode instanceof Integer) || releaseVersion.versionCode < 1 ||
    releaseVersion.versionCode > 2100000000 || !(releaseVersion.versionName instanceof String) ||
    !(releaseVersion.versionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('Invalid android/release.json versionCode or versionName.')
}

android {
    namespace = 'cc.savely.android'
    compileSdk = 36

    defaultConfig {
        applicationId = 'cc.savely.android'
        minSdk = 23
        targetSdk = 36
        versionCode = releaseVersion.versionCode
        versionName = releaseVersion.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(signingEnvironment.storeFile)
                storePassword = signingEnvironment.storePassword
                keyAlias = signingEnvironment.keyAlias
                keyPassword = signingEnvironment.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // A stable release certificate is required for APK updates and Digital Asset Links.
            // Never replace this with the debug certificate when secrets are unavailable.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

tasks.register('validateReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing requires SAVELY_ANDROID_KEYSTORE, SAVELY_ANDROID_KEYSTORE_PASSWORD, SAVELY_ANDROID_KEY_ALIAS and SAVELY_ANDROID_KEY_PASSWORD.')
        }
        if (!file(signingEnvironment.storeFile).isFile()) {
            throw new GradleException('The release keystore does not exist. Check SAVELY_ANDROID_KEYSTORE.')
        }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn 'validateReleaseSigning'
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    testImplementation 'junit:junit:4.13.2'
}
