name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Priority 1 — Quality gate
  # ─────────────────────────────────────────
  quality:
    name: Quality gate (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────
  # Priority 1 — Test gate
  # ─────────────────────────────────────────
  test:
    name: Test gate (unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ─────────────────────────────────────────
  # Priority 2 — Typecheck gate
  # ─────────────────────────────────────────
  typecheck:
    name: Typecheck gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

  # ─────────────────────────────────────────
  # Priority 2 — Security gate
  # ─────────────────────────────────────────
  security:
    name: Security gate (dependency audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high/critical only)
        # Blocca su high e critical; le vulnerabilita moderate vengono registrate ma non bloccano
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────
  # Priority 3 — E2E gate (Playwright)
  # Richiede i secrets:
  #   - VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY: valori pubblici del progetto
  #     Supabase (servono al dev server per inizializzare l'app; la sicurezza è
  #     garantita da RLS, non dalla chiave anon).
  #   - E2E_USER_EMAIL / E2E_USER_PASSWORD: utente seedato (e2e/seed.sql).
  #     Se mancanti, i test autenticati vengono saltati ma il gate pubblico gira.
  # ─────────────────────────────────────────
  e2e:
    name: E2E gate (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write app env for E2E
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::I secrets VITE_SUPABASE_URL e/o VITE_SUPABASE_ANON_KEY non sono impostati. L'app non può inizializzarsi in CI (pagina bianca)."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env.local
          echo ".env.local scritto (lunghezza chiave: ${#VITE_SUPABASE_ANON_KEY})"

      - name: Run Playwright tests
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          CI: 'true'
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
