name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Priority 1 — Quality gate
  # ─────────────────────────────────────────
  quality:
    name: Quality gate (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-router@8 richiede node >=22.22.0 (vedi engines). Pin esplicito
          # perché "22" risolve all'ultima 22.x, che non è garantito essere >=22.22.
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────
  # Priority 1 — Test gate
  # ─────────────────────────────────────────
  test:
    name: Test gate (unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-router@8 richiede node >=22.22.0 (vedi engines). Pin esplicito
          # perché "22" risolve all'ultima 22.x, che non è garantito essere >=22.22.
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ─────────────────────────────────────────
  # Priority 2 — Typecheck gate
  # ─────────────────────────────────────────
  typecheck:
    name: Typecheck gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-router@8 richiede node >=22.22.0 (vedi engines). Pin esplicito
          # perché "22" risolve all'ultima 22.x, che non è garantito essere >=22.22.
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

  # ─────────────────────────────────────────
  # Priority 2 — Security gate
  # ─────────────────────────────────────────
  security:
    name: Security gate (dependency audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-router@8 richiede node >=22.22.0 (vedi engines). Pin esplicito
          # perché "22" risolve all'ultima 22.x, che non è garantito essere >=22.22.
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high/critical only)
        # Blocca su high e critical; le vulnerabilita moderate vengono registrate ma non bloccano
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────
  # Priority 3 — E2E gate (Playwright)
  # Richiede i secrets:
  #   - E2E_USER_EMAIL / E2E_USER_PASSWORD: utente seedato (e2e/seed.sql).
  #     Se mancanti, i test autenticati vengono saltati ma il gate pubblico gira.
  # I valori Supabase (URL + anon key) sono hard-coded nel workflow perché
  # pubblici per design (la chiave anon vive nel bundle client; sicurezza via RLS).
  # ─────────────────────────────────────────
  e2e:
    name: E2E gate (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # react-router@8 richiede node >=22.22.0 (vedi engines). Pin esplicito
          # perché "22" risolve all'ultima 22.x, che non è garantito essere >=22.22.
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write app env for E2E
        # I valori Supabase (URL + chiave anon) sono PUBBLICI per design: la chiave
        # anon è pensata per essere embedded nel bundle JavaScript del browser
        # (vive in .env.local del progetto). La sicurezza è garantita da Row Level
        # Security di Supabase, non dalla segretezza della chiave. Per questo li
        # hardcodiamo qui invece di gestirli come secret — evita failure silenti
        # della CI se i secret non sono configurati correttamente.
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            'https://crqnfbahytzenisospcx.supabase.co' \
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNycW5mYmFoeXR6ZW5pc29zcGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1MzI4ODUsImV4cCI6MjA4MzEwODg4NX0.2DUoXTd-Mo40TIxJpH0JRBzCg8o18WQsRZS5R9Up9os' \
            > .env.local
          echo ".env.local scritto per il dev server"

      - name: Run Playwright tests
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          CI: 'true'
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
