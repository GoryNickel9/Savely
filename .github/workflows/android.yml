name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAVELY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAVELY_ANDROID_KEYSTORE_PASSWORD }}
      SAVELY_ANDROID_KEY_ALIAS: ${{ secrets.SAVELY_ANDROID_KEY_ALIAS }}
      SAVELY_ANDROID_KEY_PASSWORD: ${{ secrets.SAVELY_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('android/release.json').read_text())
          if type(version['versionCode']) is not int or not 1 <= version['versionCode'] <= 2100000000:
              raise SystemExit('Invalid Android versionCode')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version['versionName']):
              raise SystemExit('Invalid Android versionName')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'android-v' + version['versionName']:
              raise SystemExit('Tag does not match android/release.json')
          PY

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Deployment checker regression tests
        shell: pwsh
        run: ./android/scripts/Test-DeploymentChecks.ps1

      - name: Prepare release signing
        shell: bash
        env:
          SAVELY_ANDROID_KEYSTORE_BASE64: ${{ secrets.SAVELY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SAVELY_ANDROID_KEYSTORE_BASE64"
          test -n "$SAVELY_ANDROID_KEYSTORE_PASSWORD"
          test -n "$SAVELY_ANDROID_KEY_ALIAS"
          test -n "$SAVELY_ANDROID_KEY_PASSWORD"
          printf '%s' "$SAVELY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/savely-release.p12"
          printf 'SAVELY_ANDROID_KEYSTORE=%s\n' "$RUNNER_TEMP/savely-release.p12" >> "$GITHUB_ENV"

      - name: Test, lint and build release
        working-directory: android/app-project
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleRelease

      - name: Verify certificate and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/dist
          cp android/app-project/app/build/outputs/apk/release/app-release.apk android/dist/savely-android.apk
          cp android/release.json android/dist/release.json
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id android/dist/savely-android.apk)" = 'cc.savely.android'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/dist/savely-android.apk > android/dist/signature.txt
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          links = json.loads(Path('public/.well-known/assetlinks.json').read_text())
          expected = links[0]['target']['sha256_cert_fingerprints'][0].replace(':', '').lower()
          actual = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', Path('android/dist/signature.txt').read_text())
          if not actual or actual.group(1) != expected:
              raise SystemExit('APK certificate does not match assetlinks.json')
          PY
          cd android/dist
          sha256sum savely-android.apk > SHA256SUMS.txt

      - name: Upload distributable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savely-android
          path: android/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/savely-release.p12"
